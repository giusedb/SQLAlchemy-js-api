[project]
name = "sqlalchemy-js-api"
version = "0.1.1"
description = ""
authors = [{name = "Giuseppe Di Bona", email = "giusedb@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=6.2.1",
    "sqlalchemy>=2.0",
    "click>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ipython>=8.31.0",
    "pytest-mock>=3.14.0",
    "pytest-mockredis>=0.1.6",
    "mockaioredis>=0.0.16",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
    "pytest-asyncio>=1.2.0",
    "fakeredis>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsalchemy_api"]
